# Dokploy compose for openmw-web (single-player, server-hosted game data).
#
# Routing is done with Traefik labels (Dokploy's edge proxy runs on the external
# "dokploy-network"), matching the pattern the other apps on this host use.
# HTTPS is mandatory: the engine is multi-threaded WASM and needs cross-origin
# isolation, which browsers only grant on secure origins. server.py sends the
# COOP/COEP/CORP isolation headers itself.
services:
  morrowind:
    build:
      context: ..
      dockerfile: dokploy/Dockerfile
    restart: unless-stopped
    environment:
      OPENMW_HOST: 0.0.0.0
      OPENMW_OPEN: "0"
      OPENMW_LAUNCHER: "1"
      PORT: "8910"
    volumes:
      # Your own legally-owned Data Files (base game + Tribunal/Bloodmoon) plus
      # Tamriel Rebuilt and Tamriel_Data HD. Staged on the host; never bundled.
      - /opt/morrowind/mwdata:/app/mwdata:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.morrowind.rule=Host(`morrowind.saisoft.works`)"
      - "traefik.http.routers.morrowind.entrypoints=web,websecure"
      - "traefik.http.routers.morrowind.tls.certresolver=letsencrypt"
      - "traefik.http.services.morrowind.loadbalancer.server.port=8910"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
